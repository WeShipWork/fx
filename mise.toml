[tools]
bun = "1.3.14"
hyperfine = "1.19.0"
tmux = "3.7b"
zig = "0.16.0"

# Plain `zig build` fails on Linux hosts whose system glibc (2.41+) ships
# SFrame-based crt objects that Zig 0.16's linker cannot parse. Targeting
# Zig's bundled glibc sidesteps the system crt files. Args are appended by
# mise to the last line, so `mise run build test` maps to `zig build test`.
[tasks.build]
run = '''
if [ "$(uname -s)" = "Linux" ]; then target="$(uname -m)-linux-gnu.2.39"; fi
zig build ${target:+-Dtarget=$target} "$@"
'''
